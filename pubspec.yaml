name: elxau
description: A real estate app to buy or rent properties (ImmoTrust).
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  font_awesome_flutter: ^10.7.0
  intl: ^0.19.0
  animations: ^2.0.11
  flutter_staggered_animations: ^1.0.0
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.0.1
  url_launcher: ^6.2.5
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2
  skeletonizer: ^3.0.0
  gap: ^3.0.1
  shadcn_flutter: ^0.0.55
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/immotrust.png
    - assets/images/logo_immotrust.png
    - assets/images/logo.jpeg
    - assets/images/logo_2.jpeg

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/immotrust.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/immotrust.png"
